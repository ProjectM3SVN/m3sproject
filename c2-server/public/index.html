<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project M3S - Tactical C2 Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="hud-container">
    <header id="top-bar">
      <div class="brand">
        <span class="brand-title">M3S // TACTICAL C2</span>
        <span class="status-badge" id="c2-status">STREAM: PUBLIC</span>
      </div>

      <div class="controls">
        <button class="btn-hud" id="btn-auth-toggle">AUTHENTICATE C2</button>
        <button class="btn-hud active" id="btn-xray-toggle">X-RAY: OFF</button>
        <button class="btn-hud" id="btn-vuln-toggle">VULNERABILITY SCAN: ON</button>
      </div>
    </header>

    <main id="main-viewport">
      <!-- Left Viewport: 2D Tactical Map -->
      <section id="map-container">
        <div class="tactical-overlay">
          <div>TACTICAL SURFACE RADAR [2D]</div>
          <div class="cyan-text" id="bot-count-label">SWARM: ACTIVE</div>
          <div class="danger-text" id="hostile-count-label">HOSTILES: 0 DETECTED</div>
        </div>
        <div id="leaflet-map"></div>
      </section>

      <!-- Right Viewport: 3D WebGL Inspector -->
      <section id="view3d-container">
        <div class="tactical-overlay">
          <div>MSVIEW 3D VOXEL INSPECTOR</div>
          <div class="success-text" id="fps-counter">60 FPS | SUB-SECOND WS</div>
          <div style="font-size: 10px; color: #64748b;">[WASD] Fly | [Mouse] Orbit/Look</div>
        </div>
        <canvas id="webgl-canvas"></canvas>
      </section>
    </main>
  </div>

  <script src="/js/map2d.js"></script>
  <script src="/js/view3d.js"></script>
</body>
</html>
