<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M3S - Minecraft Server Saver Service</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #fff; overflow: hidden; }
    #app-header {
      position: absolute; top: 0; left: 0; right: 0; height: 52px;
      background: rgba(15, 17, 23, 0.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1000;
    }
    .brand { font-weight: 700; letter-spacing: 1px; color: #58a6ff; }
    .system-tags { display: flex; gap: 8px; }
    .tag { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); }
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3fb950; margin-right: 4px; }
    #map { width: 100vw; height: 100vh; background: #161b22; z-index: 1; }
    #hud-overlay {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(15, 17, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px; border-radius: 8px; font-family: monospace; font-size: 12px; z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="app-header">
    <div class="brand">M3S // MONITORING NETWORK</div>
    <div class="system-tags">
      <span class="tag"><span class="status-dot"></span>MSMap: ACTIVE</span>
      <span class="tag">MSCam: STANDBY</span>
      <span class="tag">MSView: ONLINE</span>
    </div>
  </div>

  <div id="map"></div>

  <div id="hud-overlay">
    <div>COORDINATES: <span id="pos-display" style="color: #58a6ff;">[X: 0, Z: 0]</span></div>
    <div>RENDER LAYER: SURFACE (OVERWORLD)</div>
    <div>ARCHIVE PIPELINE: INTERNET ARCHIVE (ACTIVE)</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 2,
      zoomControl: false
    }).setView([0, 0], 0);

    L.control.zoom({ position: 'topright' }).addTo(map);

    map.on('mousemove', function(e) {
      const x = Math.round(e.latlng.lng);
      const z = Math.round(-e.latlng.lat);
      document.getElementById('pos-display').innerText = `[X: ${x}, Z: ${z}]`;
    });
  </script>
</body>
</html>
