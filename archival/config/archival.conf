# Project M3S - Replay Packaging & Internet Archive Configuration
# Path: /mnt/hdd/m3s_archive/config/archival.conf

# Storage Directories
WATCH_DIR="/mnt/hdd/m3s_archive/raw_packets"
STAGING_DIR="/mnt/hdd/m3s_archive/staging"
PROCESSED_DIR="/mnt/hdd/m3s_archive/processed"
LOG_DIR="/mnt/hdd/m3s_archive/logs"

# Internet Archive (IA) Credentials
# Replace with actual S3 keys from https://archive.org/account/s3.php
IA_ACCESS_KEY="[REDACTED]"
IA_SECRET_KEY="[REDACTED]"

# IA Metadata & Collection
IA_COLLECTION="opensource_media"
IA_CREATOR="Project M3S Autonomous Swarm"
IA_SUBJECT="minecraft;anarchy;msnpc;m3s;replaymod;telemetry"
IA_LICENSE_URL="https://creativecommons.org/publicdomain/zero/1.0/"

# Batching & Compression Parameters
BATCH_TIME_WINDOW_MIN=60     # Group replays older than 60 minutes
PIGZ_THREADS=4               # Reserve 8 threads for 30 Node.js bots on i7-8700
CPU_NICE_LEVEL=19            # Lowest CPU scheduling priority
IO_NICE_CLASS=3              # Idle I/O class (prevents HDD disk starvation)

# Retention & Cleanup
LOCAL_RETENTION_DAYS=7       # Delete local staging tarballs after 7 days
MAX_RETRY_ATTEMPTS=3         # Upload retry backoff limit
